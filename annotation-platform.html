<style>
*{box-sizing:border-box}body{margin:0;background:#eeefeb;color:#263c3d;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}main{max-width:1440px;margin:16px auto;background:#fffefa;padding:28px 36px 20px}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #24685d;padding-bottom:16px;gap:16px}h1{font-family:Palatino,Georgia,serif;font-size:36px;font-weight:400;letter-spacing:-.6px;margin:0}header span{font-size:16px;color:#52645e}section{margin-top:20px}h2{font-size:20px;font-weight:600;margin:0 0 4px}.figure{overflow-x:auto}svg{display:block;width:100%;height:auto}svg text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#263c3d}.name{font-size:20px;font-weight:600}.body{font-size:16px}.small{font-size:16px;fill:#52645e}.center{text-anchor:middle}.box{fill:#fffefa;stroke:#7d9187;stroke-width:1.2}.state{fill:#f0f3ee;stroke:#7d9187;stroke-width:1.2}.focus{fill:#eaf3ec;stroke:#24685d;stroke-width:1.6}.flow{fill:none;stroke:#52645e;stroke-width:1.6;marker-end:url(#skill-arrow)}.return{fill:none;stroke:#52645e;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#skill-arrow)}.api{fill:none;stroke:#3f6b82;stroke-width:1.6;marker-end:url(#system-arrow-link)}.system-flow{fill:none;stroke:#52645e;stroke-width:1.6;marker-end:url(#system-arrow)}.mask{fill:#fffefa}.accent{fill:#24685d}.line{stroke:#c5ceca;stroke-width:1}footer{border-top:1px solid #c5ceca;margin-top:8px;padding-top:14px;display:flex;justify-content:space-between;gap:16px;font-size:14px;color:#52645e}@media(max-width:760px){main{margin:0;padding:20px 16px}h1{font-size:28px}.figure svg{min-width:1056px}footer{flex-direction:column;gap:6px}}@media print{@page{size:A3 landscape;margin:10mm}body{background:#fffefa}main{max-width:none;margin:0;padding:0}.figure{overflow:visible}.figure svg{min-width:0}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

:root{--paper:#fffefa;--machine:#405e73;--machine-fill:#f0f4f7;--model-fill:#e6eef4;--human:#24685d;--human-fill:#e8f2eb;--feedback:#926523}
.box{fill:var(--machine-fill);stroke:var(--machine)}
.model{fill:var(--model-fill);stroke:var(--machine);stroke-width:1.6}
.focus{fill:var(--human-fill);stroke:var(--human)}
.state{fill:#f2f2ed;stroke:#7d8981}
.released{fill:#edf4ee;stroke:var(--human);stroke-width:1.2}
.machine-title{fill:var(--machine)}.human-title{fill:var(--human)}
.reuse{stroke:var(--human);marker-end:url(#skill-arrow-accent)}
.correction{stroke:var(--feedback);marker-end:url(#skill-arrow-feedback)}
.feedback-label{fill:var(--feedback)}.reuse-label{fill:var(--human)}
.figure{scrollbar-color:#8d9d9b #f2f2ed}.figure:focus-visible{outline:2px solid var(--human);outline-offset:4px}::selection{background:#d5e6df;color:#204e44}

h1{font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:600;letter-spacing:-.5px}.drawio-nav{display:flex;flex-wrap:wrap;gap:24px;padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid #c5ceca;font-size:14px}.drawio-nav a{color:#24685d}.figure{background:#f8faf8;border:1px solid #c5ceca;border-radius:5px;padding:12px 0;margin-top:12px}@media print{.drawio-nav{display:none}}</style></head>

<header><h1>Human-Guided Order Annotation</h1><span>2026</span></header>

<marker id="system-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3f6b82"/></marker>

<rect width="1360" height="248" fill="#fffefa"/>
<rect x="360" y="24" width="960" height="208" rx="4" fill="#f5f6f1" stroke="#c5ceca" stroke-width="1"/>

<rect class="box" x="40" y="60" width="248" height="80" rx="4"/>

</svg></div></section>
